# Świadczenia badane przez ETL + słownik synonimów pacjenta.
#
# UWAGA (ustalenie z fazy A — patrz RECON.md, rozbieżność R1):
# w słowniku NFZ NIE MA świadczenia "PORADNIA KARDIOLOGICZNA" ani żadnego innego
# ambulatoryjnego świadczenia kardiologicznego. Nazwy w `nfz_benefits` muszą być
# DOKŁADNIE takie, jak zwraca /benefits — parametr `benefit` w /queues jest
# dopasowaniem po pełnej nazwie, a literówka daje po cichu 0 wyników (nie błąd).
#
# Liczby w komentarzach = liczba kolejek w woj. śląskim (kod 12), przypadek stabilny,
# snapshot z 2026-08-10.


# Świadczenia badane przez ETL + słownik synonimów pacjenta.
#
# UWAGA (ustalenie z fazy A - patrz RECON.md, rozbieżność R1):
# w słowniku NFZ NIE MA świadczenia "PORADNIA KARDIOLOGICZNA" ani żadnego innego
# ambulatoryjnego świadczenia kardiologicznego. Nazwy w `nfz_benefits` muszą być
# DOKŁADNIE takie, jak zwraca /benefits - fetch weryfikuje je w słowniku, bo zapytanie
# o kolejki z literówką zwraca po cichu 0 wyników zamiast błędu.
#
# Liczby w komentarzach = liczba kolejek w woj. śląskim (kod 12), przypadek stabilny,
# snapshot rozpoznania z 2026-08-10.

benefits:
  # Przypadek testowy vertical slice (decyzja właściciela po fazie A).
  - slug: kardiologia
    label: Kardiologia - oddział szpitalny
    synonyms:
      - serce
      - kardiolog
      - choroby serca
      - zawał
      - arytmia
      - oddział kardiologiczny
    nfz_benefits:
      - ODDZIAŁ KARDIOLOGICZNY                    # 29 placówek, 18 miejscowości

  - slug: ortopedia
    label: Ortopeda
    synonyms:
      - ortopeda
      - kolano
      - biodro
      - kręgosłup
      - złamanie
      - uraz
      - staw
    nfz_benefits:
      - ŚWIADCZENIA Z ZAKRESU ORTOPEDII I TRAUMATOLOGII NARZĄDU RUCHU  # 158 placówek
      - ODDZIAŁ CHIRURGII URAZOWO-ORTOPEDYCZNEJ                        # 37

  # Endoprotezoplastyka rozbita po stawie, a nie zebrana w jedno: kolejka na biodro
  # i na kolano to osobne listy oczekujących, więc wspólna mediana gubiłaby informację,
  # po którą pacjent tu przychodzi. Rewizje (reoperacje) to trzecie, odrębne pytanie.
  - slug: endoproteza-biodra
    label: Endoproteza biodra
    synonyms:
      - wymiana biodra
      - proteza biodra
      - staw biodrowy
    nfz_benefits:
      - ENDOPROTEZOPLASTYKA STAWU BIODROWEGO       # 32 placówki

  - slug: endoproteza-kolana
    label: Endoproteza kolana
    synonyms:
      - wymiana kolana
      - proteza kolana
      - staw kolanowy
    nfz_benefits:
      - ENDOPROTEZOPLASTYKA STAWU KOLANOWEGO       # 32

  - slug: endoproteza-rewizja
    label: Wymiana endoprotezy (rewizja)
    synonyms:
      - reoperacja endoprotezy
      - poluzowana endoproteza
      - wymiana protezy
    nfz_benefits:
      - REWIZJA PO ENDOPROTEZOPLASTYCE STAWU BIODROWEGO   # 21
      - REWIZJA PO ENDOPROTEZOPLASTYCE STAWU KOLANOWEGO   # 21

  - slug: ortopedia-dziecieca
    label: Ortopeda dziecięcy
    synonyms:
      - ortopeda dziecięcy
      - wady postawy
    nfz_benefits:
      - ODDZIAŁ CHIRURGII URAZOWO-ORTOPEDYCZNEJ DLA DZIECI             # 5

  - slug: kardiologia-dziecieca
    label: Kardiologia dziecięca - oddział szpitalny
    synonyms:
      - serce dziecka
      - kardiolog dziecięcy
    nfz_benefits:
      - ODDZIAŁ KARDIOLOGICZNY DLA DZIECI         # 2

  - slug: kardiochirurgia
    label: Kardiochirurgia
    synonyms:
      - operacja serca
      - bypassy
      - zastawka
    nfz_benefits:
      - ODDZIAŁ KARDIOCHIRURGICZNY                # 3
      - ODDZIAŁ KARDIOCHIRURGICZNY DLA DZIECI     # 2
      - PORADNIA KARDIOCHIRURGICZNA               # 3
      - PORADNIA KARDIOCHIRURGICZNA DLA DZIECI    # 1

  - slug: rehabilitacja-kardiologiczna
    label: Rehabilitacja kardiologiczna
    synonyms:
      - rehabilitacja serca
      - rehabilitacja po zawale
    nfz_benefits:
      - REHABILITACJA KARDIOLOGICZNA W WARUNKACH STACJONARNYCH                # 9
      - KARDIOLOGICZNA TELEREHABILITACJA HYBRYDOWA W WARUNKACH STACJONARNYCH  # 5
      - ZAKŁAD/OŚRODEK REHABILITACJI KARDIOLOGICZNEJ                          # 9
      - ZAKŁAD/OŚRODEK REHABILITACJI KARDIOLOGICZNEJ DZIENNEJ                 # 5
      - PORADNIA REHABILITACJI KARDIOLOGICZNEJ
